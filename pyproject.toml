[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 110
exclude = ["MCCxBot_Full_Audit.md", "ARCHITECTURE_PROPOSAL.md"]

[tool.ruff.lint]
# Start with correctness-critical rules for this established codebase. Broader
# style modernization can then be introduced without making CI noisy today.
select = ["E9", "F63", "F7", "F82"]
