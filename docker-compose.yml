services:
  bot:
    image: ${BOT_IMAGE:-mccxmoviebot:local}
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SESSION_WORKDIR: /app/runtime
    volumes:
      - bot-runtime:/app/runtime
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.5
    healthcheck:
      test: ["CMD", "python", "tools/container_healthcheck.py"]
      interval: 60s
      timeout: 5s
      start_period: 90s
      retries: 3

volumes:
  bot-runtime:
